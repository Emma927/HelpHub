\# 1. API Proxy: Redirects /api requests to Netlify Functions. 
# Must be placed BEFORE the catch-all rule.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. SPA Catch-all: Ensures Client-Side Routing (React Router) works on refresh.
# Must be the LAST rule. 'force = false' allows Netlify to serve existing 
# static assets (like images in /images/) before redirecting to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
